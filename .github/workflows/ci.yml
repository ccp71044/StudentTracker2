name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StudentTracker.sln

      - name: Build
        run: dotnet build StudentTracker.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/StudentTracker.Tests/StudentTracker.Tests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Publish smoke check
        run: ./installer/publish.ps1
        shell: pwsh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-win-x64
          path: release/StudentTracker-win-x64*.zip

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
